<!DOCTYPE html>
<html>
<head>
    <title>Full Screen Image</title>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }

        img {
            width: 100%;
            height: 100vh;
            object-fit: cover;
        }
    </style>
</head>

<body>

    <img src="stories-2.jpg" alt="My Image">

</body>
</html>
