<html>
<head>
    <title>Forms</title>
</head>

<body>

<center>

<h1>Registration Form</h1>

<form>

    Name:
    <input type="text" placeholder="Enter name">
    <br><br>

    Email:
    <input type="email" placeholder="Enter email">
    <br><br>

    Number:
    <input type="number" placeholder="Enter number" required>
    <br><br>

    Date of Birth:
    <input type="date">
    <br><br>

    Address:
    <br>
    <textarea rows="2" cols="60" placeholder="Enter your address"></textarea>
    <br>

    <h4>Skills:</h4>

    Python <input type="checkbox">
    Java <input type="checkbox">
    C <input type="checkbox">
    C++ <input type="checkbox">

    <br><br>

    Gender:
    <br>

    <input type="radio" name="gender" value="male">
    Male

    <input type="radio" name="gender" value="female">
    Female

    <input type="radio" name="gender" value="other">
    Other

    <br><br>

    Password:
    <input type="password" placeholder="Enter your password">
    <br><br>

    Branch:
    <select>
        <option>CSE</option>
        <option>DS</option>
        <option>CS</option>
        <option>ECE</option>
        <option selected>MECH</option>
    </select>

    <br><br>

    <input type="submit" value="Submit">
 <br><br>
already have account?<a href="login.html" target="_blank">
 <button type="button">login</button></a>
</form>

</center>

</body>
</html>
